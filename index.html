 function rd(){if($('ie'))P.ielts=$('ie').value.trim();if($('gv')){P.gpa=$('gv').value.trim().replace(',','.');P.sc=$('gs').value}}
 $('nx').onclick=()=>{rd();
  if(q.type==='gpa'){const n=parseFloat(P.gpa),mx=P.sc==='100%'?100:P.sc==='4.0'?4:5;if(!(n>0&&n<=mx)){$('er').textContent='Введи число от 0 до '+mx;return}}
  else if(q.type==='multi'){if(!(P[q.k]||[]).length){$('er').textContent='Выбери хотя бы один вариант';return}}
  else if(!P[q.k]){$('er').textContent='Выбери вариант';return}
  if(i<Q.length-1){P.step=i+1;save();vSurvey()}else{P.done=true;S.res=null;save();runMatch()}};
}
async function runMatch(){
 if(busy)return;tab='res';render();const el=$('rr');
 if(!sample){el.innerHTML='<div class="card mut">ИИ недоступен в этом режиме просмотра.</div>';return}
 busy=true;el.innerHTML='<div class="card mut">ИИ анализирует твой профиль…</div>';
 const q=`Ты куратор поступления. Профиль ученика из Казахстана: ${profTxt()}.\nБаза программ:\n${dbBrief()}\n\nВыбери 4–6 программ из базы, где у ученика реалистичные шансы, и оцени шанс как «высокий», «средний» или «низкий» ТОЛЬКО по требованиям из базы и профилю. Не обещай поступление и не выдумывай баллы. Не включай программы, которые ученику по уровню не подходят (например Болашак для школьника). Учти страны и финансы. Верни ТОЛЬКО JSON без markdown: {"summary":"2 предложения: сильные стороны и главный пробел","matches":[{"id":"id из базы","chance":"высокий|средний|низкий","why":"почему","missing":"чего не хватает"}]}`;
 try{S.res=await sample.json(q,{cache:false});save()}catch(e){busy=false;el.innerHTML='<div class="card mut">Не получилось. Попробуй ещё раз.</div><button class="btn p" id="rt">Повторить</button>';$('rt').onclick=runMatch;return}
 busy=false;render();
}
function vRes(){
 if(!S.prof.done){$('v').innerHTML='<div class="card"><h2>Сначала пройди анкету</h2><button class="btn p" id="sv">К анкете</button></div>';$('sv').onclick=()=>{tab='survey';render()};return}
 const R=S.res;
 const m=(R&&R.matches||[]).map(x=>{const p=DB.find(d=>d.id===x.id);if(!p)return'';const c=x.chance||'';return `<div class="card"><h2>${esc(p.n)}</h2><div class="chips"><span class="chip ${c==='высокий'?'':c==='низкий'?'hi':'o'}">шанс: ${esc(c)}</span><span class="chip o">${esc(p.c)}</span><span class="chip o">${esc(p.f)}</span></div><div>${esc(x.why)}</div><div class="mut" style="margin-top:6px"><b>Чего не хватает:</b> ${esc(x.missing)}</div><div class="row" style="margin-top:10px"><button class="btn p" data-g="${p.id}">Выбрать целью</button><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Сайт</a></div></div>`}).join('');
 $('v').innerHTML=`<div id="rr">${R?`<div class="card"><h2>Твои шансы</h2><div>${esc(R.summary)}</div></div><div class="warn">Это ориентировочная оценка ИИ по данным базы, а не гарантия поступления. Условия проверяй на официальных сайтах.</div>${m}`:'<div class="card"><button class="btn p" id="ru">Показать шансы</button></div>'}<button class="btn" id="rs2">Пройти анкету заново</button></div>`;
 if($('ru'))$('ru').onclick=runMatch;
 $('rs2').onclick=()=>{S.prof={};S.res=null;save();tab='survey';render()};
 $('v').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.goal=b.dataset.g;save();tab='goal';render()});
}
function vChat(){
 const left=unl()?'∞':Math.max(0,FREE-S.used);
 $('v').innerHTML=`<div class="card"><div id="log">${S.msgs.length?'':'<div class="m a">Привет! 👋 Расскажи, что тебе интересно, и я подкину варианты из нашей базы программ.</div>'}${S.msgs.map(m=>`<div class="m ${m.r}">${esc(m.t)}</div>`).join('')}</div>
 <div class="row"><input type="text" id="in" placeholder="Напиши сообщение…"><button class="btn p" id="go">Отправить</button></div>
 <div class="mut" style="margin-top:8px">Бесплатных сообщений: ${left}</div></div><div id="pay"></div>`;
 $('go').onclick=send;$('in').onkeydown=e=>{if(e.key==='Enter')send()};const l=$('log');l.scrollTop=l.scrollHeight;
}
function paywall(el){el.innerHTML='<div class="card"><h2>Лимит бесплатных сообщений</h2><p class="mut">Premium: безлимитный чат, анализ пробелов и план. Оплата через Kaspi появится в следующей версии.</p><button class="btn" disabled>Оплатить через Kaspi (скоро)</button></div>'}
async function send(){
 const t=$('in').value.trim();if(!t||busy)return;
 if(!unl()&&S.used>=FREE){paywall($('pay'));return}
 if(!sample){$('pay').innerHTML='<div class="card mut">ИИ недоступен в этом режиме просмотра.</div>';return}
 busy=true;S.msgs.push({r:'u',t},{r:'a',t:'…'});S.used++;vChat();
 const h=S.msgs.slice(0,-1).map((m,i)=>({role:m.r==='u'?'user':'assistant',content:(i===0?SYS+'\n\nПрофиль ученика: '+(S.prof.done?profTxt():'не заполнен')+'\n\nПервое сообщение ученика: ':'')+m.t}));
 try{const o=await sample(h,{cache:false,onText:({text})=>{S.msgs[S.msgs.length-1].t=text;const l=$('log');if(l&&l.lastChild){l.lastChild.textContent=text;l.scrollTop=l.scrollHeight}}});S.msgs[S.msgs.length-1].t=o.text}
 catch(e){S.msgs[S.msgs.length-1].t='Не получилось ответить. Попробуй ещё раз.'}
 busy=false;save();vChat();
}
function vBase(){
 const cs=['Все',...new Set(DB.map(p=>p.c))];
 $('v').innerHTML=`<div class="warn">Данные обновлены ${CHK}. Пометка «сверено» значит, что условия сверены с источниками в интернете, в основном неофициальными. Остальное даётся ориентиром: сроки и баллы меняются, всегда проверяй на официальном сайте.</div>
 <div class="fl">${cs.map(c=>`<button class="btn ${flt===c?'p':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
 ${DB.filter(p=>flt==='Все'||p.c===flt).map(p=>`<div class="card pr"><h2><span>${esc(p.n)}</span></h2>
 <div class="chips"><span class="chip">${esc(p.c)}</span><span class="chip o">${esc(p.l)}</span><span class="chip o">${esc(p.f)}</span><span class="chip ${p.v==='v'?'':'hi'}">${p.v==='v'?'сверено':'проверить'}</span></div>
 <ul class="rq">${p.rq.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
 <div class="mut"><b>Сроки:</b> ${esc(p.tm)}</div><div style="margin-top:6px"><b>Что делать в 10 классе:</b> ${esc(p.tip)}</div>
 <div style="margin-top:8px"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Официальный сайт</a></div></div>`).join('')}`;
 $('v').querySelectorAll('.fl button').forEach(b=>b.onclick=()=>{flt=b.dataset.c;vBase()});
}
function vGoal(){
 $('v').innerHTML=`<div class="card"><h2>Твоя цель</h2><div class="row"><select id="g"><option value="">Выбери программу из базы</option>${DB.map(p=>`<option value="${p.id}" ${S.goal===p.id?'selected':''}>${esc(p.n)}</option>`).join('')}</select><button class="btn p" id="an">Анализ</button></div>
 <div class="mut" style="margin-top:8px">Агент сравнит твой профиль из чата с требованиями выбранной программы.</div></div><div id="res">${S.gaps.map(g=>`<div class="card"><div class="chips"><span class="chip ${g.level==='high'?'hi':''}">${g.level==='high'?'главное':g.level==='mid'?'важно':'желательно'}</span></div><b>${esc(g.area)}</b><div class="mut">Сейчас: ${esc(g.now)}<br>Нужно: ${esc(g.need)}</div></div>`).join('')}</div>`;
 $('an').onclick=analyze;
}
async function analyze(){
 const id=$('g').value,p=DB.find(x=>x.id===id);if(!p||busy)return;
 if(!S.prof.done){$('res').innerHTML='<div class="card mut">Сначала пройди анкету.</div>';return}
 if(!sample)return;S.goal=id;busy=true;$('res').innerHTML='<div class="card mut">Анализирую…</div>';
 const q=`Ты куратор поступления. Профиль ученика из Казахстана: ${profTxt()}\nДиалог с агентом:\n${transcript()}\n\nЦель: ${p.n} (${p.c}). Требования из базы: ${p.rq.join(' | ')}. Сроки: ${p.tm}.\nСравни профиль и требования. Используй только факты из базы, где данных нет, пиши «проверить на сайте». Верни ТОЛЬКО JSON без пояснений и markdown: {"gaps":[{"area":"","now":"","need":"","level":"high|mid|low"}],"steps":[{"when":"срок","task":"конкретное действие"}]}. 3–5 пробелов, 5–8 шагов.`;
 try{const j=await sample.json(q,{cache:false});S.gaps=j.gaps||[];S.steps=j.steps||[];S.done={}}
 catch(e){$('res').innerHTML='<div class="card mut">Не получилось. Попробуй ещё раз.</div>';busy=false;return}
 busy=false;save();render();
}
function vPlan(){
 if(!S.steps.length){$('v').innerHTML='<div class="card mut">Плана пока нет. Выбери цель во вкладке «Цель».</div>';return}
 const p=DB.find(x=>x.id===S.goal),n=S.steps.filter((_,i)=>S.done[i]).length,pc=Math.round(n/S.steps.length*100);
 $('v').innerHTML=`<div class="card"><h2>План: ${esc(p?p.n:'')}</h2><div class="bar"><i style="width:${pc}%"></i></div><div class="mut" style="margin-top:6px">Выполнено ${n} из ${S.steps.length}</div></div>
 <div class="card">${S.steps.map((s,i)=>`<label class="ck"><input type="checkbox" data-i="${i}" ${S.done[i]?'checked':''}><span><b>${esc(s.when)}</b><br>${esc(s.task)}</span></label>`).join('')}</div>`;
 $('v').querySelectorAll('input').forEach(c=>c.onchange=()=>{S.done[c.dataset.i]=c.checked;save();vPlan()});
}
function vAdmin(){
 $('v').innerHTML=`<div class="card"><h2>Админ-панель (временная)</h2>
 <label class="ck"><input type="checkbox" id="fr" ${S.free?'checked':''}><span>Всё бесплатно для меня (без лимита сообщений)</span></label>
 <div class="row" style="margin-top:10px"><button class="btn" id="rs">Сбросить счётчик</button><button class="btn" id="rd">Сбросить все данные</button></div>
 <p class="mut">Видна только владельцу страницы. Это не настоящая защита: для платежей и лимитов нужен сервер.</p></div>`;
 $('fr').onchange=e=>{S.free=e.target.checked;save();render()};$('rs').onclick=()=>{S.used=0;save();render()};
 $('rd').onclick=()=>{S={msgs:[],goal:'',gaps:[],steps:[],done:{},used:0,free:true,prof:{},res:null};save();tab='survey';render()};
}
render();
(async()=>{try{const u=await claude.use('user');owner=u?u.isOwner():false;sample=await claude.use('sample');render()}catch(e){}})();
</script></body></html>
